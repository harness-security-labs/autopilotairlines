<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Card Service Audit{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.5; }
        .container { width: 1200px; max-width: 100%; margin: 0 auto; padding: 1.5rem; }
        header { background: #1e293b; color: white; padding: 1rem 0; margin-bottom: 1.5rem; }
        header .container { display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        nav a { color: #94a3b8; text-decoration: none; margin-left: 1.5rem; font-size: 0.875rem; }
        nav a:hover, nav a.active { color: white; }
        .card { background: white; border-radius: 0.5rem; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #334155; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; table-layout: fixed; }
        th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { font-weight: 600; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:hover td { background: #f8fafc; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 500; }
        .badge-settled { background: #dcfce7; color: #166534; }
        .badge-declined { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-charge { background: #fef2f2; color: #dc2626; }
        .badge-refund { background: #ecfdf5; color: #059669; }
        .badge-topup { background: #eff6ff; color: #2563eb; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-inactive { background: #f1f5f9; color: #64748b; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat { background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 1rem 1.25rem; }
        .stat-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-top: 0.25rem; }
        .amount-negative { color: #dc2626; }
        .amount-positive { color: #059669; }
        a.link { color: #2563eb; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        .empty { text-align: center; padding: 2rem; color: #94a3b8; }
        .filter-bar { display: flex; gap: 0.75rem; margin-bottom: 1rem; align-items: center; }
        .filter-bar input, .filter-bar select { padding: 0.375rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.375rem; font-size: 0.8125rem; }
        .filter-bar button { padding: 0.375rem 1rem; background: #2563eb; color: white; border: none; border-radius: 0.375rem; font-size: 0.8125rem; cursor: pointer; }
        .filter-bar button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Card Service Audit Console</h1>
            <nav>
                <a href="/audit/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="/audit/cards" class="{% if active == 'cards' %}active{% endif %}">Cards</a>
                <a href="/audit/transactions" class="{% if active == 'transactions' %}active{% endif %}">Transactions</a>
            </nav>
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
