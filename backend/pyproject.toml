[project]
name = "autopilot-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.136.1",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-aws>=0.2.12",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.29",
    "redis>=7.4.0",
    "reportlab>=4.5.1",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.47.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
